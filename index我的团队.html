<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
<img src="./images/icons/logo 扣.png" alt="Logo" class="logo-img" style="width: 24px; height: 24px; margin-right: 8px;">
            <span class="logo-text">SOPHICAR</span>
 
            </div>
            <nav class="nav-menu">
                <a href="index第一页.html" class="nav-item">
                     
                   <img src="./images/icons/overview.svg" class="icon" alt="Overview">
                    <span>个人信息</span>
                </a>
                <a href="index.html" class="nav-item">
                   <img src="./images/icons/book.svg" class="icon" alt="Overview">
                    <span>学情分析</span>

                <a href="index文件夹.html" class="nav-item">
                    <img src="./images/icons/chart-pie.svg" class="icon" alt="Overview">

                </a>
                <a href="index我的团队.html" class="nav-item active">
                    <img src="./images/icons/users.svg" class="icon" alt="Overview">
                    <span>我的团队</span>
                </a>
            </nav>
            <div class="user-profile">
                <div class="avatar">
                    <img src="images\icons\头像1.png" alt="User">
                </div>
                <span>李华</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <h1>列表</h1>
            </header>
            
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="搜索">
            </div>

            <div class="table-container">
                <div class="table-header">
                    <div class="col">用户</div>
                    <div class="col">邮箱</div>
                    <div class="col">职位</div>
                </div>
                <div class="table-body" id="team-list">
                    <!-- Items will be populated by JS -->
                </div>
            </div>
<header class="main-header">

    
    <!-- 新增：太阳图标按钮 -->
    <button class="sun-corner-btn" onclick="window.location.href='index我的团队 深色模式.html'">
        <img src="images/icons/月亮浅色.png" alt="Sun Icon" width="20" height="20">
    </button>
</header>
            <div class="pagination">
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn">4</button>
                <button class="page-btn">5</button>
            </div>
        </main>

        <!-- Right Panel -->
        <aside class="details-panel">
            <div class="panel-header">
                <div class="panel-controls">
                    <i class="fa-solid fa-table-columns"></i>
                    <i class="fa-solid fa-chevron-up"></i>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>

            <div class="selected-user">
                <div class="user-header">
                    <h2>李华</h2>
                    <span class="user-id">2022015306</span>
                </div>
                <div class="large-avatar">
                    <img src="images\icons\头像1.png" alt="Large Avatar">
                </div>
            </div>

            <div class="info-cards">
                <div class="info-card">
                    <label>姓名</label>
                    <div class="value">李华</div>
                </div>
                <div class="info-card">
                    <label>邮箱</label>
                    <div class="value">2994287817@qq.com</div>
                </div>
                <div class="info-card">
                    <label>职位</label>
                    <div class="value">学生</div>
                </div>
                <div class="info-card">
                    <label>注册时间</label>
                    <div class="value-row">
                        <span>2 2, 2025, 8:00 </span>
                        <i class="fa-regular fa-calendar"></i>
                    </div>
                </div>
                <div class="info-card memo-card">
                    <label>备忘录</label>
                    <textarea readonly></textarea>
                </div>
            </div>
        </aside>
    </div>
    <script src="main我的团队 深色模式.js"></script>
    <!-- 聊天触发按钮 -->
<div class="chat-trigger" onclick="toggleChat()" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <img src="./images/IP改-02.png" alt="SOPHICAR小助手" class="assistant-img" style="width: 80px; height: 80px;">
    <div style="display: flex; align-items: center; gap: 8px;">
        <i class="ph ph-chat-centered-dots" style="font-size: 20px;"></i>
        <span>聊天小助手</span>
    </div>
</div>

<!-- 聊天弹窗（默认隐藏） -->
<div class="chat-popup" id="chatPopup" style="display: none;">
    <div class="chat-header">
        <div class="chat-avatar">
            <img src="images\IP改-02.png" alt="Assistant">
        </div>
        <div class="chat-info">
            <span class="chat-name">SOPHICAR小助手</span>
            <i class="ph ph-caret-down"></i>
        </div>
        <button class="close-chat-btn" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-body">
        <!-- 消息列表 -->
        <div class="message received">
            <div class="avatar">
                <img src="images\icons\头像2.png" alt="Assistant" style="border-radius: 50%;">
            </div>
            <div class="bubble">
                接下来专注于figma 优化，优化完后再处理web部署
                <div class="time">8:00 PM</div>
            </div>
        </div>

        <div class="message sent">
            <div class="avatar">
                <img src="images\icons\头像3.png" alt="Me" style="border-radius: 50%;">
            </div>
            <div class="bubble">
                好的老师，我现在在静态页面部署了不能帮我看看问题吗
                <div class="time">8:04 PM</div>
            </div>
        </div>

        <div class="message received">
            <div class="avatar">
                <img src="images\icons\头像2.png" alt="Assistant" style="border-radius: 50%;">
            </div>
            <div class="bubble">
                我发你几个教程你看看，不行的话再沟通
                <div class="time">8:00 PM</div>
            </div>
        </div>

        <div class="message sent">
            <div class="avatar">
                <img src="images\icons\头像3.png" alt="Me" style="border-radius: 50%;">
            </div>
            <div class="bubble">
                收到，已经完成部署了谢谢老师。
                <div class="time">8:04 PM</div>
            </div>
        </div>
    </div>
    <div class="chat-footer">
        <div class="input-container">
            <input type="text" placeholder="输入信息" id="chatInput">
            <div class="input-actions">
                <button class="send-btn">➡️</button>
                <button class="attach-btn">📎</button>
            </div>
        </div>
    </div>
</div>
<script src="chat-widget.js"></script>
</body>
</html>
